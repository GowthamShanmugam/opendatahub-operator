apiVersion: v1
kind: ConfigMap
metadata:
  name: {{.DashboardRedirectConfigName}}
  namespace: {{.DashboardRedirectNamespace}}
  labels:
    app: {{.DashboardRedirectName}}
    {{.PartOfLabelKey}}: {{.PartOfGatewayConfig}}
data:
  nginx.conf: |
    # For more information on configuration, see:
    #   * Official English Documentation: http://nginx.org/en/docs/
    #   * Official Russian Documentation: http://nginx.org/ru/docs/

    # RHOAIENG-56723: Use a fixed worker count instead of auto (one per CPU core)
    # to prevent OOMKill on nodes with many cores.
    worker_processes 2;
    error_log /var/log/nginx/error.log notice;
    pid /run/nginx.pid;

    # Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
    include /usr/share/nginx/modules/*.conf;

    events {
        worker_connections 1024;
    }

    http {
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile            on;
        tcp_nopush          on;
        keepalive_timeout   65;
        types_hash_max_size 4096;

        include             /etc/nginx/mime.types;
        default_type        application/octet-stream;

        # Load modular configuration files from the /etc/nginx/conf.d directory.
        # See http://nginx.org/en/docs/ngx_core_module.html#include
        # for more information.
        include /opt/app-root/etc/nginx.d/*.conf;

        server {
            listen       8080 default_server;
            listen       [::]:8080 default_server;
            server_name  _;
            root         /opt/app-root/src;

            # Load configuration files for the default server block.
            include /opt/app-root/etc/nginx.default.d/*.conf;
        }

    # Settings for a TLS enabled server.
    #
    #    server {
    #        listen       443 ssl;
    #        listen       [::]:443 ssl;
    #        http2        on;
    #        server_name  _;
    #        root         /opt/app-root/src;
    #
    #        ssl_certificate "/etc/pki/nginx/server.crt";
    #        ssl_certificate_key "/etc/pki/nginx/private/server.key";
    #        ssl_session_cache shared:SSL:1m;
    #        ssl_session_timeout  10m;
    #        ssl_ciphers PROFILE=SYSTEM;
    #        ssl_prefer_server_ciphers on;
    #
    #        # Load configuration files for the default server block.
    #        include /opt/app-root/etc/nginx.default.d/*.conf;
    #    }

    }
  deprecation.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta http-equiv="refresh" content="10;url=REDIRECT_URL">
      <title>URL has moved</title>
      <style>
        body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #333; margin: 20px; }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
        p { font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
        a { color: #06c; }
        .note { color: #888; font-size: 13px; margin-top: 20px; }
      </style>
    </head>
    <body>
      <h1>This URL has moved.</h1>
      <p>Please update your bookmark to: <a href="REDIRECT_URL">REDIRECT_HOST</a></p>
      <p class="note">You will be redirected in <span id="t">10</span> seconds.</p>
      <script>var s=10,e=document.getElementById("t");setInterval(function(){if(s>0){s--;e.textContent=s;}},1000);</script>
    </body>
    </html>
  redirect.conf: |
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Deprecation "true" always;

        set $target "https://{{.GatewayHostname}}$request_uri";

        # Browsers get an HTML deprecation notice before redirect.
        # All other clients (scripts, APIs) get instant 301.
        if ($http_accept ~* "text/html") {
            rewrite ^ /deprecation last;
        }

        return 301 $target;
    }

    location = /deprecation {
        internal;
        root /opt/app-root/src;
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Deprecation "true" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" always;

        set $target "https://{{.GatewayHostname}}$request_uri";
        sub_filter "REDIRECT_URL" $target;
        sub_filter "REDIRECT_HOST" "https://{{.GatewayHostname}}/";
        sub_filter_once off;
        sub_filter_types text/html;

        try_files /deprecation.html =404;
    }
