apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- name: kserve-kueuelabels-validator.opendatahub.io
  namespaceSelector:
    matchExpressions:
    - key: kueue.openshift.io/managed
      operator: In
      values: ["true"]
    - key: kueue-managed
      operator: In
      values: ["true"]
- name: kubeflow-kueuelabels-validator.opendatahub.io
  namespaceSelector:
    matchExpressions:
    - key: kueue.openshift.io/managed
      operator: In
      values: ["true"]
    - key: kueue-managed
      operator: In
      values: ["true"]
- name: ray-kueuelabels-validator.opendatahub.io
  namespaceSelector:
    matchExpressions:
    - key: kueue.openshift.io/managed
      operator: In
      values: ["true"]
    - key: kueue-managed
      operator: In
      values: ["true"]
