    app.kubernetes.io/part-of: opendatahub-operator
  name: opendatahub-operator-webhook-service-new
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    control-plane: controller-manager
    name: opendatahub-operator
